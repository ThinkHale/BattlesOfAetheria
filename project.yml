name: AetheriaClash
options:
  bundleIdPrefix: com.thinkhale
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: MZ3635323W
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  FightCore:
    path: Packages/FightCore
targets:
  AetheriaClash:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
        excludes:
          - "Assets.xcassets"
          - "**/README.md"
      - path: App/Resources/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: FightCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Aetheria Clash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.action-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UIApplicationSupportsIndirectInputEvents: true
        UIAppFonts:
          - Cinzel-Bold.ttf
          - Cinzel-Black.ttf
          - EBGaramond.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thinkhale.aetheriaclash
        PRODUCT_NAME: AetheriaClash
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  AetheriaClashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: AetheriaClash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thinkhale.aetheriaclash.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AetheriaClash
        CODE_SIGN_STYLE: Automatic
schemes:
  AetheriaClash:
    build:
      targets:
        AetheriaClash: all
        AetheriaClashUITests: [test]
    test:
      targets:
        - AetheriaClashUITests
        - package: FightCore/FightCoreTests
    run:
      config: Debug
    archive:
      config: Release
